services:
  app:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://foodanalyzer:dev@db:5432/foodanalyzer
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16
    environment:
      POSTGRES_USER: foodanalyzer
      POSTGRES_PASSWORD: dev
      POSTGRES_DB: foodanalyzer
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U foodanalyzer -d foodanalyzer"]
      interval: 5s
      timeout: 5s
      retries: 10
